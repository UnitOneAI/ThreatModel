# Skill index (human-readable). The engine builds the live index by scanning each
# skill's frontmatter, so this file is documentation — adding a skill file is
# what adds a capability. These bundled skills (flat <domain>/<name>.md, legacy
# `id` form) ship in the wheel so the engine works offline. The canonical community
# skill library is github.com/UnitOneAI/SecuritySkills (SKILL.md format); point the
# engine at it with SYNTHESIS_SKILLS_DIR=/path/to/SecuritySkills/skills — the loader
# reads both formats. The planner reads the index to SELECT skills per component;
# reviewers load a (bounded) skill prompt as their system prompt (read-only).
version: 1
domains:
  appsec:
    - appsec/threat-modeling      # base STRIDE method, always included
    - appsec/secure-code-review
    - appsec/api-security
    - appsec/authentication
  ai-security:
    - ai-security/llm-top-10
# Skill evolution: outcomes calibrate each skill's confidence_cap locally
# (synthesis_engine/memory.py). New patterns become human-reviewed PRs that add
# examples/ or a new skill file. Skill bodies never auto-merge — see CONTRIBUTING.md.
# Every skill PR is checked by scripts/scan_skills.py in CI (injection + control-id gate).
